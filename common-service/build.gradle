plugins {
	id 'org.springframework.boot'
}

description = 'Common Service for Assistudy'

// spring-grpc-dependencies BOM은 루트 build.gradle에서 전역 관리

dependencies {
	// gRPC 클라이언트
	implementation 'org.springframework.grpc:spring-grpc-client-spring-boot-starter'
	implementation project(':shared')

	// Eureka Client
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
	// Spring Boot Actuator
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// Spring Security
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// Prometheus metrics
	implementation 'io.micrometer:micrometer-registry-prometheus'
	implementation 'org.springframework.boot:spring-boot-zipkin'
	implementation 'org.springframework.boot:spring-boot-micrometer-tracing-brave'
	implementation 'io.micrometer:micrometer-tracing-bridge-brave'
	implementation 'io.zipkin.reporter2:zipkin-reporter-brave'
	// Spring Web
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// Spring Data JPA
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// Redis (캐싱)
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	// Spring DevTools
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	// MySQL
	runtimeOnly 'com.mysql:mysql-connector-j'
	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
	// Swagger UI
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'
	// Feign Client
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
	implementation 'io.github.openfeign:feign-micrometer'
	// Circuit Breaker
	implementation 'io.github.resilience4j:resilience4j-spring-boot4:2.4.0'
	implementation 'io.github.resilience4j:resilience4j-micrometer:2.4.0'
	// Kafka (room 삭제 이벤트 발행 - SAGA choreography, #40)
	implementation 'org.springframework.kafka:spring-kafka'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// Spring Boot 4.x는 MockMvc 테스트 지원(@AutoConfigureMockMvc 등)을 별도 모듈로 분리함
	testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// 통합테스트 (Testcontainers: MySQL + Redis)
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-mysql'
}
