spring:
  kafka:
    bootstrap-servers: localhost:9092
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  cache:
    type: redis

eureka:
  client:
    enabled: false

management:
  tracing:
    sampling:
      probability: 0.0

gms:
  api:
    base-url: http://localhost:9999
    key: test-key

openapi:
  service:
    gateway-url: http://localhost:8080
