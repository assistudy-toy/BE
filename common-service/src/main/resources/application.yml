server:
  shutdown: graceful

assistudy:
  user-service:
    # rest(Feign, 기본값)
    client-mode: ${USER_SERVICE_CLIENT_MODE:rest}

spring:
  application:
    name: common-service
  jpa:
    open-in-view: false
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    openfeign:
      client:
        config:
          user-service:
            # 웜업 상태 정상 REST 호출이 ~22ms(baseline)라 2초는 충분히 여유 있는 상한선
            connect-timeout: 2000
            read-timeout: 2000
  grpc:
    client:
      channels:
        user-service:
          # discovery:// 스킴은 EurekaGrpcNameResolverProvider(GrpcDiscoveryConfig)가 처리
          address: discovery:///user-service
          negotiation-type: plaintext

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: ${ZIPKIN_URL:http://localhost:19411}/api/v2/spans

resilience4j:
  circuitbreaker:
    instances:
      userService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 2s
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
      webRtcService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 3s
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true

springdoc:
  info:
    title: Common Service API
    description: Assistudy Common Service
    version: 1.0.0
  swagger-ui:
    operations-sorter: method
    display-request-duration: true
  api-docs:
    path: /v3/api-docs
